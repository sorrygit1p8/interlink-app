project_id = "interlink-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["interlink://auth/callback", "http://localhost:8081/auth/callback", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.rate_limit]
email_sent = 3
token_refresh = 150
sign_in_sign_ups = 20
token_verifications = 20

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.push-worker]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.deletion-worker]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.image-upload]
verify_jwt = false
import_map = "./functions/deno.json"
